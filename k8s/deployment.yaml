apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortel-app
  labels:
    app: fortel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fortel
  template:
    metadata:
      labels:
        app: fortel
    spec:
      containers:
      - name: fortel
        # Replace image with your registry/image:tag
        image: docker.io/your-docker-username/fortel_stock-price-prediction:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
