apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortel-app
  namespace: fortel
  labels:
    app: fortel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fortel
  template:
    metadata:
      labels:
        app: fortel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      containers:
      - name: fortel
        # Replace image with your registry/image:tag if needed
        image: docker.io/rohan2044/fortel-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: MODEL_URL
          value: "" # Set to the model storage URL if using external models
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5 
          failureThreshold: 6
      # Optional imagePullSecrets if using a private registry
      # imagePullSecrets:
      # - name: regcred
